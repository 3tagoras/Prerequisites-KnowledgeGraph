[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "prerequisites_knowledge_graph"
version = "0.0.1"
description = "kiskis"
authors = [
  { name = "Moreno Esparza J. A." },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["prerequisites_knowledge_graph"]
include = ["pyproject.toml", "prerequisites_knowledge_graph/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["prerequisites_knowledge_graph"]
force-sort-within-sections = true

